version: 2

project_name: codex-proxy

builds:
  - id: codex-proxy
    main: ./cmd/codex-proxy
    binary: codex-proxy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/sortedcord/codex-proxy/internal/buildinfo.Version={{ .Version }}
      - -X github.com/sortedcord/codex-proxy/internal/buildinfo.Commit={{ .Commit }}
      - -X github.com/sortedcord/codex-proxy/internal/buildinfo.Date={{ .CommitDate }}

archives:
  - id: default
    builds:
      - codex-proxy
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - docs/deployment.md
      - docs/versioning.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: sortedcord
    name: codex-proxy
  prerelease: auto
  mode: replace
  header: |
    ## codex-proxy {{ .Tag }}
