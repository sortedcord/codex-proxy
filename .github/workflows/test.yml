name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22.x', '1.27.1', 'stable']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal integration/bifrost)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: ./scripts/build.sh
      - name: Check injected build identity
        run: |
          expected="codex-proxy $(tr -d '\n\r' < internal/buildinfo/VERSION)-dev (commit=$(git rev-parse HEAD), date=$(git show -s --format=%cI HEAD))"
          test "$(./bin/codex-proxy version)" = "$expected"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install pinned lint tooling
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
      - name: Verify configuration, lint and strict formatting
        run: ./scripts/lint.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build container image
        run: docker build -t codex-proxy:test .
      - name: Smoke test the non-root, read-only container
        run: |
          set -eu
          test "$(docker image inspect -f '{{.Config.User}}' codex-proxy:test)" = '10001:10001'
          trap 'docker logs codex-proxy-smoke; docker rm -f -v codex-proxy-smoke' EXIT
          docker run -d \
            --name codex-proxy-smoke \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount type=volume,dst=/home/app/.codex \
            --mount type=volume,dst=/home/app/.local/share/codex-proxy \
            -p 127.0.0.1:8080:8080 \
            -e CODEX_PROXY_API_KEY=docker-smoke-inference \
            -e CODEX_PROXY_MANAGEMENT_KEY=docker-smoke-management \
            codex-proxy:test
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8080/health > health.json
          python3 - <<'PY'
          import json
          with open('health.json') as stream:
              health = json.load(stream)
          assert health['status'] == 'ok'
          assert health['credential_configured'] is False
          PY
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8080/status/account)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer docker-smoke-management' \
            http://127.0.0.1:8080/status/account)" = 503
          docker stop --time 30 codex-proxy-smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' codex-proxy-smoke)" = 0

  systemd:
    name: systemd (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - run: ./scripts/build.sh
      - name: Verify unit and smoke test the systemd sandbox
        run: |
          systemd-analyze --version
          sudo python3 scripts/test-systemd.py ./bin/codex-proxy

  bifrost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: integration/bifrost/go.sum
      - name: Check Bifrost test formatting
        run: test -z "$(gofmt -l integration/bifrost/*.go)"
      - name: Vet Bifrost test module
        working-directory: integration/bifrost
        run: go vet ./...
      - name: Test the real Bifrost OpenAI provider against a fake Codex backend
        env:
          CODEX_PROXY_BIFROST_TEST: '1'
        run: go test -race -run '^TestBifrostCompatibility$' -v -timeout 10m ./internal/proxy
