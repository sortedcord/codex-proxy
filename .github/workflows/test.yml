name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build -trimpath -ldflags='-s -w' -o bin/codex-proxy ./cmd/codex-proxy

  bifrost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: integration/bifrost/go.sum
      - name: Check Bifrost test formatting
        run: test -z "$(gofmt -l integration/bifrost/*.go)"
      - name: Vet Bifrost test module
        working-directory: integration/bifrost
        run: go vet ./...
      - name: Test the real Bifrost OpenAI provider against a fake Codex backend
        env:
          CODEX_PROXY_BIFROST_TEST: '1'
        run: go test -race -run '^TestBifrostCompatibility$' -v -timeout 10m ./internal/proxy
